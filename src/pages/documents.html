<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.documents">Documents | goHR</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/main.js"></script>
</head>
<body data-shell="admin" data-page="documents" data-breadcrumb="Home > Documents">

<main class="main">
<div class="page-wrapper" data-hr-docs>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <h1 class="page-title" data-i18n="nav.documents">Documents</h1>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary btn-sm" id="dc-new-tpl" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg> <span data-i18n="doc.newTemplate">New template</span></button>
        <button class="btn btn-outline btn-sm" id="dc-letterhead" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 15h6"/></svg> <span data-i18n="doc.letterhead">Letterhead</span></button>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="inv-tabs" role="tablist">
    <button class="inv-tab active" data-tab="templates" role="tab" aria-selected="true" type="button"><span data-i18n="doc.tabTemplates">Templates</span> <span class="inv-tab-badge" id="dc-tabcount-tpl"></span></button>
    <button class="inv-tab" data-tab="issued" role="tab" aria-selected="false" type="button"><span data-i18n="doc.tabIssued">Issued</span> <span class="inv-tab-badge" id="dc-tabcount-iss"></span></button>
    <button class="inv-tab" data-tab="signed" role="tab" aria-selected="false" type="button"><span data-i18n="doc.tabSigned">Signed</span> <span class="inv-tab-badge" id="dc-tabcount-sgn"></span></button>
  </div>

  <!-- ══ TAB: TEMPLATES ══ -->
  <section data-tabpanel="templates">
    <div class="tpl-grid" id="dc-tpl-grid"></div>
  </section>

  <!-- ══ TAB: ISSUED ══ -->
  <section data-tabpanel="issued" hidden>
    <div class="card emp-toolbar">
      <div class="card-body emp-toolbar-row">
        <div class="emp-toolbar-left">
          <span class="caption-muted" id="dc-count"></span>
        </div>
        <div class="emp-toolbar-right" role="toolbar" data-i18n-aria="doc.issuedTitle" aria-label="Issued documents">
          <button class="btn btn-outline btn-sm" id="dc-export" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg> <span data-i18n="doc.exportExcel">Export Excel</span></button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="doc.issuedTitle">Issued documents</div></div>
      <div class="card-body table-wrap">
        <table class="table emp-table" data-page-length="10">
          <thead>
            <tr>
              <th data-i18n="doc.noH">No.</th>
              <th data-i18n="doc.issuedH">Issued</th>
              <th data-i18n="doc.nameH">Name</th>
              <th data-i18n="doc.typeH">Type</th>
              <th data-i18n="doc.empH">Employee</th>
              <th data-i18n="doc.langH">Language</th>
              <th class="emp-actions-col" data-i18n="common.actions">Actions</th>
            </tr>
          </thead>
          <tbody id="dc-iss-rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ══ TAB: SIGNED ══ -->
  <section data-tabpanel="signed" hidden>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="doc.signedTitle">Signed documents</div></div>
      <div class="card-body">
        <table class="table emp-table" data-page-length="10">
          <thead>
            <tr>
              <th data-i18n="doc.nameH">Name</th>
              <th data-i18n="doc.typeH">Type</th>
              <th data-i18n="doc.signedH">Signed</th>
              <th class="emp-actions-col" data-i18n="common.actions">Actions</th>
            </tr>
          </thead>
          <tbody id="dc-signed-rows"></tbody>
        </table>
      </div>
    </div>
  </section>

</div>
</main>

</body>
</html>
