<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Dr. | goHR</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body data-shell="admin" data-page="go-dr" data-breadcrumb="Home > Settings > Go Dr.">
  <main class="main" data-own-actions>
  <div class="page-wrapper">
  <div class="page-header">
    <div class="page-header-row">
      <div>
        <h1 class="page-title"><svg class="godr-title-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg><span data-i18n="godr.title">Go Dr.</span></h1>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary btn-sm" id="godr-check" type="button" data-i18n="godr.checkNow">Check now</button>
      </div>
    </div>
  </div>

  <!-- KPI cards -->
  <div class="godr-kpis">
    <div class="godr-kpi">
      <div class="godr-kpi-top">
        <span class="godr-kpi-ico ico-health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span>
        <span class="godr-kpi-label" data-i18n="godr.kpi.health">System health</span>
      </div>
      <div class="godr-kpi-val" id="godr-kpi-score">0</div>
      <div class="godr-kpi-sub" id="godr-kpi-health-sub"></div>
    </div>
    <div class="godr-kpi">
      <div class="godr-kpi-top">
        <span class="godr-kpi-ico ico-pages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="4" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="10" width="7" height="11" rx="1.5"/></svg></span>
        <span class="godr-kpi-label" data-i18n="godr.kpi.pages">Pages OK</span>
      </div>
      <div class="godr-kpi-val" id="godr-kpi-pages">0</div>
      <div class="godr-kpi-sub" id="godr-kpi-pages-sub"></div>
    </div>
    <div class="godr-kpi">
      <div class="godr-kpi-top">
        <span class="godr-kpi-ico ico-avg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"/></svg></span>
        <span class="godr-kpi-label" data-i18n="godr.kpi.avg">Avg load</span>
      </div>
      <div class="godr-kpi-val" id="godr-kpi-avg">0ms</div>
      <div class="godr-kpi-sub" id="godr-kpi-avg-sub"></div>
    </div>
    <div class="godr-kpi">
      <div class="godr-kpi-top">
        <span class="godr-kpi-ico ico-conn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3 8 3v14z"/><path d="M12 17v2m0 0-4-4m4 4 4-4"/></svg></span>
        <span class="godr-kpi-label" data-i18n="godr.kpi.conn">Connections</span>
      </div>
      <div class="godr-kpi-val" id="godr-kpi-conn">0</div>
      <div class="godr-kpi-sub" id="godr-kpi-conn-sub"></div>
    </div>
    <div class="godr-kpi">
      <div class="godr-kpi-top">
        <span class="godr-kpi-ico ico-issues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v2m0 4h.01M4.22 16.15l3.48-6.91a2 2 0 013.56-1.54h6.88a2 2 0 011.97 2.53l3.48 6.91"/></svg></span>
        <span class="godr-kpi-label" data-i18n="godr.kpi.issues">Issues</span>
      </div>
      <div class="godr-kpi-val" id="godr-kpi-issues">0</div>
      <div class="godr-kpi-sub" id="godr-kpi-issues-sub"></div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row col-2">
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="godr.kpi.rtt">Avg page load (ms)</div></div>
      <div class="card-body"><div class="chart-box chart-lg" id="chart-godr-rtt"></div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="godr.kpi.errors">Errors / min</div></div>
      <div class="card-body"><div class="chart-box chart-lg" id="chart-godr-err"></div></div>
    </div>
  </div>

  <div class="row col-2">
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="godr.kpi.pages">Pages</div></div>
      <div class="card-body"><div class="chart-box chart-lg" id="chart-godr-pages"></div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="godr.kpi.health">Health trend</div></div>
      <div class="card-body"><div class="chart-box chart-lg" id="chart-godr-health"></div></div>
    </div>
  </div>

  <!-- Per-page probe table — renderTable fills this. The renderer existed but
       had no element, so the whole per-page breakdown was invisible. -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span class="godr-dot" id="godr-dot"></span>
        <span data-i18n="godr.pagesTitle">Pages</span>
        <span class="caption-muted" id="godr-count"></span>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table godr-table">
          <thead>
            <tr>
              <th data-i18n="godr.st.page">Page</th>
              <th data-i18n="godr.st.status">Status</th>
              <th data-i18n="godr.kpi.rtt">Load</th>
              <th data-i18n="godr.probDesc">Description</th>
              <th data-i18n="godr.probFix">Suggested fix</th>
            </tr>
          </thead>
          <tbody id="godr-pages"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Connection alert — renderConnAlert fills this and unhides it when the
       link to the auth API is degraded. It had no id, so the renderer never
       found it. -->
  <div class="godr-alert" id="godr-alert" hidden>
    <div class="godr-alert-row">
      <span class="godr-alert-icon"></span>
      <span class="godr-alert-text"></span>
    </div>
  </div>

  <!-- Problems table -->
  <div class="card">
    <div class="card-header"><div class="card-title"><span data-i18n="godr.problemsTitle">Open issues</span> <span class="badge" id="godr-problem-count"></span></div></div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table godr-table" data-page-length="10">
          <thead>
            <tr>
              <th data-i18n="godr.probTime">Time</th>
              <th data-i18n="godr.probPage">Page</th>
              <th data-i18n="godr.probDesc">Description</th>
              <th data-i18n="godr.probFix">Suggested fix</th>
              <th data-i18n="godr.probSeverity">Severity</th>
            </tr>
          </thead>
          <tbody id="godr-problems"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Runtime meta: uptime · last check · auto-refresh · service worker.
       renderKpis fills this; the element did not exist, so the line never
       appeared. -->
  <div class="godr-meta" id="godr-meta"></div>

  <!-- Status row — footer -->
  <div class="godr-footer">
    <span data-i18n="godr.lastCheck">Last check:</span> <span id="godr-last-check">—</span>
    <span class="godr-badge ok" id="godr-badge-overall">All good</span>
    <button class="btn btn-outline btn-sm" id="godr-check-foot" type="button" data-i18n="godr.checkNow">Check now</button>
  </div>

</div>
</main>

</body>
</html>
