<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.profitability">Profitability | goHR</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/main.js"></script>
</head>
<body data-shell="admin" data-page="profitability" data-breadcrumb="Home > Profitability">

<main class="main">
<div class="page-wrapper" data-hr-profit>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <h1 class="page-title" data-i18n="nav.profitability">Profitability</h1>
        <div class="caption-muted page-meta" data-page-meta></div>
      </div>
    </div>
  </div>

  <!-- STATS — 5-up -->
  <div class="row pr-stats">
    <div class="card">
      <div class="stat">
        <div class="stat-icon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg></div>
        <div class="stat-content"><div class="stat-label" data-i18n="pf.revenue">Billed revenue</div><div class="stat-value-row"><span class="stat-value" id="pf-stat-rev">0</span></div><div class="stat-subtext" data-i18n="pf.revenueSub">Issued invoices, excl. VAT</div></div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div class="stat-content"><div class="stat-label" data-i18n="pf.cost">Secondment cost</div><div class="stat-value-row"><span class="stat-value" id="pf-stat-cost">0</span></div><div class="stat-subtext" data-i18n="pf.costSub">Wages + employer GOSI</div></div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div class="stat-content"><div class="stat-label" data-i18n="pf.margin">Gross margin</div><div class="stat-value-row"><span class="stat-value" id="pf-stat-margin">0</span></div><div class="stat-subtext" data-i18n="pf.marginSub">Revenue − cost</div></div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></div>
        <div class="stat-content"><div class="stat-label" data-i18n="pf.marginPct">Margin rate</div><div class="stat-value-row"><span class="stat-value" id="pf-stat-rate">0%</span></div><div class="stat-subtext" data-i18n="pf.marginPctSub">Margin share of revenue</div></div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div>
        <div class="stat-content"><div class="stat-label" data-i18n="pf.internal">Internal staff cost</div><div class="stat-value-row"><span class="stat-value" id="pf-stat-internal">0</span></div><div class="stat-subtext" data-i18n="pf.internalSub">Not billed to clients</div></div>
      </div>
    </div>
  </div>

  <!-- PERIOD -->
  <div class="card emp-toolbar">
    <div class="card-body emp-toolbar-row">
      <div class="emp-toolbar-left">
        <select class="form-control" id="pf-month" style="width:auto"></select>
        <span class="caption-muted" id="pf-note"></span>
      </div>
      <div class="emp-toolbar-right"></div>
    </div>
  </div>

  <!-- CLIENT TABLE -->
  <div class="card emp-table-card">
    <div class="card-body p-0 emp-table-wrap">
      <div class="table-responsive">
        <table class="table emp-table">
          <thead>
            <tr>
              <th data-i18n="pf.clientH">Client</th>
              <th data-i18n="pf.headsH">Heads</th>
              <th data-i18n="pf.revenueH">Revenue</th>
              <th data-i18n="pf.costH">Cost</th>
              <th data-i18n="pf.marginH">Margin</th>
              <th data-i18n="pf.rateH">Rate</th>
              <th style="width:22%"></th>
            </tr>
          </thead>
          <tbody id="pf-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

</body>
</html>
