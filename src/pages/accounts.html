<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.accounts">Accounts | goHR</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/main.js"></script>
</head>
<body data-shell="admin" data-page="accounts" data-breadcrumb="Home > Accounts">

<main class="main">
<div class="page-wrapper" data-hr-accounts>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <h1 class="page-title" data-i18n="nav.accounts">Accounts</h1>
        <div class="caption-muted page-meta" data-page-meta></div>
      </div>
    </div>
  </div>

  <div class="row col-3">
    <div class="card">
      <div class="stat">
        <div class="stat-content">
          <div class="stat-label" data-i18n="acc.outstanding">Outstanding AR</div>
          <div class="stat-value-row"><span class="stat-value" id="acc-stat-ar">0</span></div>
          <div class="stat-subtext" id="acc-stat-ar-sub">—</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-content">
          <div class="stat-label" data-i18n="acc.expenses">Expenses</div>
          <div class="stat-value-row"><span class="stat-value" id="acc-stat-exp">0</span></div>
          <div class="stat-subtext" id="acc-stat-exp-sub">—</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <div class="stat-content">
          <div class="stat-label" data-i18n="acc.margin">Net margin</div>
          <div class="stat-value-row"><span class="stat-value" id="acc-stat-margin">0</span></div>
          <div class="stat-subtext" id="acc-stat-margin-sub">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row col-8-4">
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="acc.aging">Receivables aging</div></div>
      <div class="card-body" id="acc-aging"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="acc.byCategory">Expenses by category</div></div>
      <div class="card-body" id="acc-expenses"></div>
    </div>
  </div>

  <div class="row col-1">
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="acc.byClient">Margin by client</div></div>
      <div class="card-body" id="acc-clients"></div>
    </div>
  </div>

  <div class="row col-1">
    <div class="card">
      <div class="card-body cz-actions">
        <a class="btn btn-outline" href="invoices.html" data-i18n="acc.openInvoicing">Open Invoicing</a>
        <a class="btn btn-outline" href="expenses.html" data-i18n="acc.openExpenses">Open Expenses</a>
        <a class="btn btn-outline" href="profitability.html" data-i18n="acc.openProfitability">Open Profitability</a>
      </div>
    </div>
  </div>

</div>
</main>

</body>
</html>
