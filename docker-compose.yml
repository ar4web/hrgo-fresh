version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8080
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # No published port: the backend is reached through the frontend's nginx
    # proxy on the internal network only. Publishing 8080 exposed the raw API
    # (and its CORS-free /auth surface) to the host and anything routing to it.
    expose:
      - "8080"
    volumes:
      - gohr-data:/app/data
    environment:
      - NODE_ENV=production
      - AUTH_PORT=8080
      - AUTH_DB_PATH=/app/data/gohr.sqlite
      # nginx forwards X-Forwarded-For. Without this the geofence resolves the
      # client's IP as nginx's own container address, classifies it as private,
      # and auto-allows every request — making the Saudi-only country control a
      # no-op in the only shipped topology.
      - AUTH_TRUST_PROXY=1
    restart: unless-stopped

volumes:
  gohr-data:
