version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8080
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - gohr-data:/app/data
    environment:
      - NODE_ENV=production
      - AUTH_PORT=8080
    restart: unless-stopped

volumes:
  gohr-data:
